# Template for ao-api-forge — copied to docs/features/<slug>/contracts/openapi.yaml
# (or contracts.ao-api-forge/openapi.yaml), then DERIVED:
#   operations       <- PRD §4 user stories, §5 AC
#   fields           <- data-model.md + migrations (field mapping in references/repo-practice.md)
#   error responses  <- sad.md §6 alt-branches + PRD §5.1 catalogue + PRD §10 refusals
# This is a DELTA for services/core/api/openapi.yaml: a self-contained valid document with the new
# paths and components plus copies (same shape) of every repo component it references.
# No /api prefix, no version in paths. Every schema in components, used through $ref.
openapi: 3.1.0

info:
  title: <feature> — contract delta
  version: 0.1.0
  description: |
    <why this API exists — one paragraph from PRD §1>
  x-merge-target: services/core/api/openapi.yaml
  x-generated-by: ao-api-forge

servers:
  - url: http://localhost:8080

tags:
  # One tag per bounded context the delta touches. A new context also needs the wiring checklist
  # in api-sync-report.md (oapi-codegen.yaml, sqlc.yaml, depguard, cmd/api/main.go).
  - name: <context>
    description: <what the context owns>

# ---- Security scheme: session cookie after Google sign-in --------------------------------------
# Global default. Public operations (system/health, sign-in callbacks) declare `security: []`.
security:
  - SessionCookie: []

paths:
  # ---- List: repo keyset cursor ----------------------------------------------------------------
  /<context>/<resources>:
    get:
      operationId: list<Resources>
      tags: [<context>]
      summary: List <resources>, newest first, one page at a time
      x-problem-types:
        "401": [identity.session_required]
        "403": [<context>.<authorization_code>]
        "422": [about:blank]          # schema validation or a malformed cursor
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of <resources>.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>Page" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    # ---- Create ------------------------------------------------------------------------------
    post:
      operationId: create<Resource>
      tags: [<context>]
      summary: <create ...>
      x-problem-types:
        "401": [identity.session_required]
        "403": [<context>.<authorization_code>]
        "409": [<context>.<invariant_code>]
        "422": [<context>.<validation_code>]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/New<Resource>" }
            example:
              title: "Тестовий протокол"     # placeholder data only
      responses:
        "201":
          description: The <resource> was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /<context>/<resources>/{id}:
    get:
      operationId: get<Resource>
      tags: [<context>]
      summary: Get one <resource>
      x-problem-types:
        "401": [identity.session_required]
        "403": [<context>.<authorization_code>]
        "404": [<context>.<resource>_not_found]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The <resource>.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Command on a revisioned aggregate (optimistic concurrency) ----------------------------
  /<context>/<resources>/{id}/<command>:
    post:
      operationId: <command><Resource>
      tags: [<context>]
      summary: <command the state machine allows>
      x-problem-types:
        "401": [identity.session_required]
        "403": [<context>.<authorization_code>]
        "404": [<context>.<resource>_not_found]
        "409": [<context>.<conflict_code>, <context>.transition_not_allowed]
        "422": [<context>.<validation_code>]
        "503": [<context>.<unavailable_code>]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/<Command><Resource>Request" }
      responses:
        "200":
          description: The <resource> in its new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/<Resource>" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: <session cookie name from the sign-in ADR>
      description: HttpOnly, Secure, SameSite=Lax session cookie set after Google sign-in.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor; omit for the first page.
      schema: { type: string, minLength: 1 }

  schemas:
    # ---- Entity: every property traces to a column (field mapping) -----------------------------
    <Resource>:
      type: object
      required: [id, title, status, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }                       # text CHECK char_length 1..200
        status: { $ref: "#/components/schemas/<Resource>Status" }
        revision: { type: integer, format: int32, minimum: 1 }
        amount_cents: { type: [integer, "null"], format: int64 }   # bigint minor units
        currency: { $ref: "#/components/schemas/Currency" }
        meeting_date: { type: string, format: date }  # date, Europe/Kyiv calendar day
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    New<Resource>:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }

    <Command><Resource>Request:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          format: int32
          minimum: 1
          description: The revision the member saw; a stale one answers 409.

    # Named enum from CHECK (x IN (...)) — values verbatim from the DDL.
    <Resource>Status:
      type: string
      enum: [<value_a>, <value_b>]

    # Copy of the repo component — keep the shape identical.
    Currency:
      type: string
      enum: [UAH, EUR, USD]

    # ---- Cursor page: repo shape {items, next_cursor} -------------------------------------------
    <Resource>Page:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/<Resource>" }
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to get the next page; null on the last page.

    # ---- Problem: copy of the repo schema (RFC 9457) ---------------------------------------------
    # `type` is about:blank for validator / router errors and urn:problem:<context>.<error_name>
    # for every domain error from PRD §5.1; the codes per status live in x-problem-types.
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string }
        detail: { type: string }

  # ---- Error responses as reusable components ----------------------------------------------------
  responses:
    UnprocessableEntity:
      description: Request failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:<context>.<validation_code>
            title: <catalogue message>
            status: 422
            errors:
              - { pointer: /<field>, detail: <what is wrong> }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:problem:<context>.<resource>_not_found", title: <catalogue message>, status: 404 }
    Conflict:
      description: A state invariant or a concurrent change refused the request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:problem:<context>.<conflict_code>", title: <catalogue message>, status: 409 }
    Forbidden:
      description: The member may not do this; the body is the same whether the target exists or not.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:problem:<context>.<authorization_code>", title: <catalogue message>, status: 403 }
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:problem:identity.session_required", title: <catalogue message>, status: 401 }
    ServiceUnavailable:
      description: A dependency is down; nothing was saved.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: "urn:problem:<context>.<unavailable_code>", title: <catalogue message>, status: 503 }
